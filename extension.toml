id = "kedi"
name = "Kedi"
version = "0.5.0"
schema_version = 1
authors = [
    "Mert Sırakaya <mert@kedi-lang.org>",
    "Doğukan Yiğit Polat <yigit@neurograph.net>",
]
description = "Kedi language support: highlighting, language server, embedded Python, run tasks and debugging."
repository = "https://github.com/kedi-lang/kedi-zed"
snippets = ["./snippets/kedi.json"]

[debug_adapters.kedi]
schema_path = "debug_adapter_schemas/kedi.json"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[language_servers.kedi-lsp]
name = "kedi-lsp"
languages = ["Kedi"]

[language_servers.kedi-lsp.language_ids]
"Kedi" = "kedi"

[language_servers.kedi-embedded-python]
name = "kedi-embedded-python"
languages = ["Kedi"]

[language_servers.kedi-embedded-python.language_ids]
"Kedi" = "kedi"

[language_servers.kedi-python-docstrings]
name = "kedi-python-docstrings"
languages = ["Python"]

[language_servers.kedi-python-docstrings.language_ids]
"Python" = "python"

[grammars.kedi]
repository = "https://github.com/kedi-lang/tree-sitter-kedi"
rev = "765e5f04f4588caa3451a90ce5aa685af1ec730f"
